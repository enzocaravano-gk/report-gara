<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match Report · Bianco Nero Granata</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <style>
        :root {
            --accent: #8B0000;
            --accent-dark: #600000;
            --accent-rgb: 139, 0, 0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f4f4;
            padding: 20px;
            color: #1a1a1a;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            padding: 30px 35px 40px;
            border: 1px solid #e0e0e0;
            position: relative;
        }

        /* ---- LOGO ROW ---- */
        .logo-row {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            flex-wrap: wrap;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1 1 300px;
        }
        .logo-box img {
            max-height: 80px;
            max-width: 160px;
            object-fit: contain;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 6px;
            background: #fff;
            transition: 0.2s;
        }
        .logo-box img:not([src]),
        .logo-box img[src=""] {
            display: none;
        }
        .logo-box img[src]:not([src=""]) {
            display: block;
        }
        .logo-placeholder {
            font-size: 13px;
            color: #888;
        }

        /* ---- HAMBURGER MENU ---- */
        .hamburger-wrap {
            position: relative;
            margin-left: auto;
        }
        .hamburger-btn {
            background: transparent;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 6px 10px;
            color: var(--accent);
            transition: 0.2s;
            line-height: 1;
        }
        .hamburger-btn:hover {
            color: var(--accent-dark);
            transform: scale(1.05);
        }
        .hamburger-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #ffffff;
            border: 1.5px solid var(--accent);
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 16px 20px;
            min-width: 200px;
            display: none;
            z-index: 100;
            margin-top: 8px;
        }
        .hamburger-dropdown.open {
            display: block;
        }
        .hamburger-dropdown .logo-upload {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .hamburger-dropdown .logo-upload label {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.3px;
            cursor: pointer;
        }
        .hamburger-dropdown .logo-upload input[type="file"] {
            font-size: 13px;
            padding: 6px 8px;
            border: 1.5px dashed var(--accent);
            border-radius: 10px;
            background: #fcfcfc;
            cursor: pointer;
        }
        .hamburger-dropdown .logo-upload input[type="file"]::-webkit-file-upload-button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
        }
        .hamburger-dropdown .logo-upload input[type="file"]::-webkit-file-upload-button:hover {
            background: var(--accent-dark);
        }
        .hamburger-dropdown .logo-upload.hidden {
            display: none;
        }
        .hamburger-dropdown .menu-item {
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .hamburger-dropdown .menu-item:last-child {
            border-bottom: none;
        }
        .color-picker {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .color-picker-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.3px;
        }
        .color-swatches {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 26px;
            height: 26px;
            padding: 0;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 1.5px #d0d0d0;
            cursor: pointer;
            transition: 0.15s;
        }
        .color-swatch:hover {
            transform: scale(1.12);
        }
        .color-swatch.selected {
            box-shadow: 0 0 0 1.5px #fff, 0 0 0 3.5px var(--accent);
        }

        /* ---- HEADER ---- */
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 16px;
        }
        h1 small {
            font-size: 15px;
            font-weight: 400;
            color: var(--accent);
            margin-left: auto;
        }

        /* ---- FORM ROWS ---- */
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 30px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .row .field {
            display: flex;
            flex-direction: column;
            flex: 1 1 140px;
            min-width: 120px;
        }
        .row .field label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .row .field input,
        .row .field select {
            padding: 10px 14px;
            border: 1.5px solid #d0d0d0;
            border-radius: 12px;
            font-size: 15px;
            background: #fafafa;
            transition: 0.2s;
            width: 100%;
            font-family: inherit;
            color: #1a1a1a;
        }
        .row .field input:focus,
        .row .field select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
            background: #fff;
        }

        /* ---- TABLE ---- */
        .table-wrap {
            overflow-x: auto;
            margin: 24px 0 18px;
            border-radius: 16px;
            border: 1.5px solid #e0e0e0;
            background: #ffffff;
        }
        .player-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 800px;
        }
        .player-table th {
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px;
            text-align: left;
            border-bottom: 2px solid var(--accent-dark);
            white-space: nowrap;
        }
        .player-table td {
            padding: 6px 6px;
            border-bottom: 1px solid #eeeeee;
            vertical-align: middle;
        }
        .player-table tr:hover td {
            background: #fdf6f6;
        }
        .col-num {
            width: 40px;
            text-align: center;
            font-weight: 600;
            color: var(--accent);
        }
        .col-name {
            min-width: 130px;
        }
        .col-role {
            width: 140px;
        }
        .col-min {
            width: 85px;
        }
        .col-eval {
            width: 80px;
            text-align: center;
        }
        .col-notes {
            min-width: 140px;
        }

        .player-table input[type="text"],
        .player-table input[type="number"],
        .player-table select {
            width: 100%;
            padding: 6px 8px;
            border: 1.5px solid #d0d0d0;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            transition: 0.15s;
            font-family: inherit;
            color: #1a1a1a;
        }
        .player-table input:focus,
        .player-table select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.12);
        }
        .player-table input[type="number"] {
            width: 70px;
            text-align: center;
            padding: 6px 4px;
        }

        /* ---- DETTATURA VOCALE FORMAZIONE (pulsante unico) ---- */
        .dictation-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 4px 0 18px;
        }
        .btn-dictate {
            background: #ffffff;
            color: var(--accent);
            border: 1.5px solid var(--accent);
        }
        .btn-dictate:hover {
            background: #fdf6f6;
            border-color: var(--accent-dark);
        }
        .btn-dictate.listening {
            background: var(--accent);
            color: #fff;
            animation: mic-pulse 1s ease-in-out infinite;
        }
        .btn-dictate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .dictation-hint {
            font-style: italic;
        }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.45); }
            50% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb), 0); }
        }

        /* ---- RATING CIRCLE (VERDE, GIALLO, ROSSO) ---- */
        .rating-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #b0b0b0;
            background: #ffffff;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 auto;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }
        .rating-circle:hover {
            transform: scale(1.08);
            border-color: var(--accent);
        }
        .rating-circle.rating-1 {
            background: #2b9e2b;
            border-color: #1e7a1e;
            box-shadow: 0 2px 10px rgba(43, 158, 43, 0.4);
        }
        .rating-circle.rating-2 {
            background: #e8c42b;
            border-color: #c4a020;
            box-shadow: 0 2px 10px rgba(232, 196, 43, 0.4);
        }
        .rating-circle.rating-3 {
            background: #d43d3d;
            border-color: #b02a2a;
            box-shadow: 0 2px 10px rgba(212, 61, 61, 0.4);
        }

        /* ---- NOTE GENERALI ---- */
        .notes-section {
            margin: 22px 0 16px;
        }
        .notes-section label {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            display: block;
            margin-bottom: 6px;
        }
        .notes-section textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #d0d0d0;
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 90px;
            background: #fafafa;
            transition: 0.2s;
            color: #1a1a1a;
        }
        .notes-section textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.10);
            background: #fff;
        }

        /* ---- BOTTONI ---- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 28px;
            align-items: center;
            justify-content: space-between;
        }
        .actions .left {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
        }
        .btn-pdf {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.35);
        }
        .btn-pdf:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(var(--accent-rgb), 0.40);
        }
        .btn-pdf:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-clear {
            background: #ffffff;
            color: var(--accent);
            border: 1.5px solid var(--accent);
        }
        .btn-clear:hover {
            background: #fdf6f6;
            border-color: var(--accent-dark);
        }
        .btn-reset {
            background: #ffffff;
            color: var(--accent);
            border: 1.5px solid var(--accent);
        }
        .btn-reset:hover {
            background: #fdf6f6;
            border-color: var(--accent-dark);
        }
        .text-muted {
            color: #6a6a6a;
            font-size: 13px;
            font-weight: 500;
        }

        /* ---- SPINNER ---- */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
        }
        .btn-pdf .spinner {
            display: none;
        }
        .btn-pdf.loading .spinner {
            display: inline-block;
        }
        .btn-pdf.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 760px) {
            .app {
                padding: 18px 16px 30px;
            }
            h1 {
                font-size: 22px;
                flex-wrap: wrap;
            }
            h1 small {
                margin-left: 0;
                width: 100%;
                font-size: 13px;
            }
            .logo-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .hamburger-wrap {
                margin-left: 0;
                align-self: flex-end;
            }
            .row .field {
                flex: 1 1 100%;
                min-width: 100%;
            }
            .player-table {
                font-size: 13px;
                min-width: 700px;
            }
            .rating-circle {
                width: 32px;
                height: 32px;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .actions .left {
                flex-direction: column;
            }
            .btn {
                justify-content: center;
                padding: 14px 20px;
            }
            .player-table input[type="number"] {
                width: 54px;
            }
            .hamburger-dropdown {
                right: -10px;
                min-width: 180px;
            }
        }

        /* ---- STYLES PER PDF (applicate con classe .pdf-export) ----
           Il PDF usa un formato pagina calcolato dinamicamente sull'altezza
           reale del contenuto (vedi exportPdf in JS), quindi qui NON serve
           schiacciare tutto per farlo stare in una A4 fissa: basta una
           larghezza fissa e coerente, e nascondere gli elementi solo-UI. */
        .app.pdf-export {
            width: 800px !important;
            max-width: 800px !important;
            margin: 0 auto !important;
            padding: 22px 26px 26px !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            border: none !important;
        }
        .app.pdf-export .logo-row {
            margin-bottom: 14px !important;
            padding-bottom: 12px !important;
        }
        .app.pdf-export .logo-box img {
            max-height: 55px !important;
            max-width: 110px !important;
        }
        .app.pdf-export .logo-placeholder,
        .app.pdf-export .actions,
        .app.pdf-export .hamburger-wrap {
            display: none !important;
        }
        .app.pdf-export h1 {
            font-size: 20px !important;
            margin-bottom: 16px !important;
        }
        .app.pdf-export h1 small {
            font-size: 12px !important;
        }
        .app.pdf-export .row {
            gap: 8px 10px !important;
            margin-bottom: 14px !important;
            flex-wrap: nowrap !important;
        }
        .app.pdf-export .row .field {
            flex: 1 1 0 !important;
            min-width: 0 !important;
        }
        .app.pdf-export .row .field:first-child {
            flex: 2 1 0 !important;
        }
        .app.pdf-export .row .field.field-result {
            flex: 0 0 80px !important;
            min-width: 0 !important;
            width: 80px !important;
        }
        .app.pdf-export .row .field label {
            font-size: 10px !important;
        }
        .app.pdf-export .row .field input,
        .app.pdf-export .row .field select {
            padding: 5px 8px !important;
            font-size: 12px !important;
        }
        .app.pdf-export .table-wrap {
            overflow: visible !important;
            margin: 12px 0 14px !important;
        }
        .app.pdf-export .player-table {
            font-size: 12px !important;
            min-width: 0 !important;
            width: 100% !important;
            table-layout: fixed !important;
        }
        .app.pdf-export .player-table th {
            font-size: 10px !important;
            padding: 6px 4px !important;
        }
        .app.pdf-export .player-table td {
            padding: 3px 4px !important;
            vertical-align: top !important;
        }
        .app.pdf-export .col-num {
            width: 24px !important;
        }
        .app.pdf-export .col-name {
            width: 120px !important;
            min-width: 0 !important;
        }
        .app.pdf-export .col-role {
            width: 48px !important;
        }
        .app.pdf-export .col-min {
            /* più larga del necessario per "45": lo spazio in eccesso
               resta vuoto a destra del numero (la cella non è centrata)
               e serve a staccare la colonna Valutazione da Minuti. */
            width: 78px !important;
        }
        .app.pdf-export .col-notes {
            /* nessuna larghezza esplicita: la colonna Note prende
               tutto lo spazio residuo della tabella */
            min-width: 0 !important;
        }
        .app.pdf-export .player-table input[type="text"],
        .app.pdf-export .player-table input[type="number"],
        .app.pdf-export .player-table select {
            padding: 3px 5px !important;
            font-size: 11px !important;
        }
        .app.pdf-export .player-table input[type="number"] {
            width: 40px !important;
        }
        .app.pdf-export .dictation-bar {
            display: none !important;
        }
        .app.pdf-export .col-eval {
            /* è la larghezza di Minuti (sopra) a fare il lavoro di
               staccare questa colonna da Minuti; qui serve solo lo
               spazio minimo che fa stare "Valut." su una riga senza
               sbordare nell'intestazione di Note. */
            width: 46px !important;
        }
        .app.pdf-export .rating-circle {
            width: 22px !important;
            height: 22px !important;
            border-width: 2px !important;
            /* l'alone colorato (box-shadow) del pallino valutato è pensato
               per l'interfaccia a schermo intero: nella colonna stretta del
               PDF "mangia" lo spazio verso Minuti dando l'impressione di
               sovrapposizione, quindi qui lo rimuoviamo. */
            box-shadow: none !important;
            margin: 3px auto 0 !important;
        }
        .app.pdf-export .notes-section {
            margin: 14px 0 4px !important;
        }
        .app.pdf-export .notes-section label {
            font-size: 12px !important;
        }
        .app.pdf-export .notes-section textarea {
            padding: 8px 10px !important;
            font-size: 12px !important;
            min-height: 50px !important;
        }
        .app.pdf-export .text-muted {
            display: none !important;
        }

        /* ---- "GEMELLI" DI TESTO PER L'ESPORTAZIONE PDF ----
           html2canvas non va a capo correttamente il testo dentro
           input/textarea (lo disegna tutto su una riga, che sbord fuori
           dal riquadro). In fase di export sostituiamo ogni campo con un
           div identico nell'aspetto ma con wrapping vero: se la nota è
           lunga, il div cresce in altezza invece di essere tagliato. */
        .print-value {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        [data-pdf-hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- LOGO + HAMBURGER -->
        <div class="logo-row">
            <div class="logo-box">
                <img id="clubLogo" alt="Logo società" />
                <span class="logo-placeholder" id="logoPlaceholder">(logo non caricato)</span>
            </div>
            <div class="hamburger-wrap">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">☰</button>
                <div class="hamburger-dropdown" id="hamburgerDropdown">
                    <div class="menu-item" id="logoUploadMenuItem">
                        <div class="logo-upload" id="logoUploadContainer">
                            <label for="logoUpload">⬆️ Carica logo</label>
                            <input type="file" id="logoUpload" accept="image/*" />
                        </div>
                    </div>
                    <div class="menu-item">
                        <div class="color-picker">
                            <span class="color-picker-label">🎨 Colore squadra</span>
                            <div class="color-swatches" id="colorSwatches">
                                <button type="button" class="color-swatch selected" data-accent="#8B0000" data-accent-dark="#600000" data-accent-rgb="139, 0, 0" style="background:#8B0000" title="Granata" aria-label="Granata"></button>
                                <button type="button" class="color-swatch" data-accent="#1652a1" data-accent-dark="#0f3b73" data-accent-rgb="22, 82, 161" style="background:#1652a1" title="Blu" aria-label="Blu"></button>
                                <button type="button" class="color-swatch" data-accent="#d32f2f" data-accent-dark="#a02323" data-accent-rgb="211, 47, 47" style="background:#d32f2f" title="Rosso" aria-label="Rosso"></button>
                                <button type="button" class="color-swatch" data-accent="#1e8449" data-accent-dark="#14602f" data-accent-rgb="30, 132, 73" style="background:#1e8449" title="Verde" aria-label="Verde"></button>
                                <button type="button" class="color-swatch" data-accent="#0288d1" data-accent-dark="#01579b" data-accent-rgb="2, 136, 209" style="background:#0288d1" title="Azzurro" aria-label="Azzurro"></button>
                                <button type="button" class="color-swatch" data-accent="#6a3fa0" data-accent-dark="#4d2d75" data-accent-rgb="106, 63, 160" style="background:#6a3fa0" title="Viola" aria-label="Viola"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HEADER -->
        <h1>
            Scheda Partita
            <small>Rosa 26 · ruoli a scelta</small>
        </h1>

        <!-- ANAGRAFICA GARA -->
        <div class="row">
            <div class="field">
                <label for="opponent">Avversario</label>
                <input type="text" id="opponent" placeholder="es. Milan" />
            </div>
            <div class="field field-result">
                <label for="result">Risultato</label>
                <input type="text" id="result" placeholder="es. 2-1" />
            </div>
            <div class="field">
                <label for="matchType">Tipo gara</label>
                <select id="matchType">
                    <option value="Amichevole">Amichevole</option>
                    <option value="Campionato" selected>Campionato</option>
                    <option value="Coppa">Coppa</option>
                    <option value="Torneo">Torneo</option>
                    <option value="Altro">Altro</option>
                </select>
            </div>
            <div class="field">
                <label for="venue">Sede</label>
                <select id="venue">
                    <option value="Casa">🏠 Casa</option>
                    <option value="Trasferta">🚌 Trasferta</option>
                    <option value="Neutro">⚖️ Neutro</option>
                </select>
            </div>
            <div class="field">
                <label for="titolarCount">Titolari</label>
                <select id="titolarCount">
                    <option value="11">11</option>
                    <option value="9">9</option>
                </select>
            </div>
            <div class="field">
                <label for="formation">Modulo</label>
                <select id="formation"></select>
            </div>
        </div>

        <!-- DETTATURA FORMAZIONE -->
        <div class="dictation-bar">
            <button type="button" class="btn btn-dictate" id="dictateFormationBtn">
                <span class="btn-text">🎙️ Detta formazione</span>
            </button>
            <span class="text-muted dictation-hint">Di': "numero 1 Caravano, numero 2 Fusco…"</span>
        </div>

        <!-- TABELLA GIOCATORI -->
        <div class="table-wrap">
            <table class="player-table" id="playerTable">
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th class="col-name">Calciatore</th>
                        <th class="col-role">Ruolo</th>
                        <th class="col-min">Minuti</th>
                        <th class="col-eval">Valut.</th>
                        <th class="col-notes">Note</th>
                    </tr>
                </thead>
                <tbody id="playerBody"></tbody>
            </table>
        </div>

        <!-- NOTE GENERALI -->
        <div class="notes-section">
            <label for="generalNotes">📝 Note generali sulla gara</label>
            <textarea id="generalNotes" placeholder="Inserisci qui le osservazioni, i cambi, la prestazione della squadra…"></textarea>
        </div>

        <!-- BOTTONI -->
        <div class="actions">
            <div class="left">
                <button class="btn btn-pdf" id="exportPdfBtn">
                    <span class="btn-text">📄 Esporta PDF</span>
                    <span class="spinner"></span>
                </button>
                <button class="btn btn-clear" id="clearBtn">🧹 Pulisci formazione</button>
                <button class="btn btn-reset" id="resetBtn">⟲ Reset completo</button>
            </div>
            <span class="text-muted" id="playerCountLabel">26 giocatori · 11 titolari · modulo 4-4-2</span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM REFS ----
            const opponentEl = document.getElementById('opponent');
            const resultEl = document.getElementById('result');
            const matchTypeEl = document.getElementById('matchType');
            const venueEl = document.getElementById('venue');
            const titolarCountEl = document.getElementById('titolarCount');
            const formationEl = document.getElementById('formation');
            const playerBody = document.getElementById('playerBody');
            const generalNotesEl = document.getElementById('generalNotes');
            const exportBtn = document.getElementById('exportPdfBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resetBtn = document.getElementById('resetBtn');
            const playerCountLabel = document.getElementById('playerCountLabel');
            const logoImg = document.getElementById('clubLogo');
            const logoPlaceholder = document.getElementById('logoPlaceholder');
            const logoUpload = document.getElementById('logoUpload');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const hamburgerDropdown = document.getElementById('hamburgerDropdown');
            const logoUploadMenuItem = document.getElementById('logoUploadMenuItem');

            const TOTAL_PLAYERS = 26;
            const ROLES = ['Portiere', 'Difensore', 'Centrocampista', 'Attaccante'];

            // ---- FORMATIONS ----
            const FORMATIONS_11 = ['4-4-2', '4-3-3', '4-2-3-1', '3-5-2', '5-3-2', '4-1-2-1-2'];
            const FORMATIONS_9 = ['3-3-2', '3-2-3', '3-4-1', '2-3-3'];

            // ---- STATE ----
            let playerData = [];

            // ---- DETTATURA VOCALE FORMAZIONE ("numero 1 Caravano, numero 2 Fusco…") ----
            const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
            const speechSupported = !!SpeechRecognitionCtor;
            const dictateBtn = document.getElementById('dictateFormationBtn');

            const NUMBER_WORDS = {
                uno: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8,
                nove: 9, dieci: 10, undici: 11, dodici: 12, tredici: 13, quattordici: 14,
                quindici: 15, sedici: 16, diciassette: 17, diciotto: 18, diciannove: 19, venti: 20,
                ventuno: 21, ventidue: 22, ventitre: 23, 'ventitré': 23, ventiquattro: 24,
                venticinque: 25, ventisei: 26
            };

            let formationRecognition = null;
            let formationListening = false;
            let formationFinalTranscript = '';

            function capitalizeName(str) {
                return str.trim().split(/\s+/).map(function(w) {
                    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
                }).join(' ');
            }

            // Riconosce ripetizioni del pattern "numero <N> <nome>" nel testo
            // dettato, sia con cifre ("numero 1") sia con numeri scritti in
            // lettere ("numero uno"), e ne estrae le coppie {numero, nome}.
            function parseFormationTranscript(text) {
                const matches = [];
                const re = /numero\s+([a-zà]+|\d{1,2})\s+([^]*?)(?=\bnumero\b|$)/gi;
                let m;
                while ((m = re.exec(text)) !== null) {
                    const token = m[1].toLowerCase();
                    const num = /^\d+$/.test(token) ? parseInt(token, 10) : NUMBER_WORDS[token];
                    const name = m[2].replace(/[.,;]+$/, '').trim();
                    if (num >= 1 && num <= TOTAL_PLAYERS && name) {
                        matches.push({ num: num, name: capitalizeName(name) });
                    }
                }
                return matches;
            }

            function applyFormationTranscript(text) {
                const matches = parseFormationTranscript(text);
                if (!matches.length) return;
                let changed = false;
                matches.forEach(function(m) {
                    const idx = m.num - 1;
                    if (playerData[idx] && playerData[idx].name !== m.name) {
                        playerData[idx].name = m.name;
                        changed = true;
                    }
                });
                if (changed) {
                    renderPlayers();
                    autoSave();
                }
            }

            function updateDictateBtnUI() {
                if (!dictateBtn) return;
                dictateBtn.classList.toggle('listening', formationListening);
                dictateBtn.disabled = !speechSupported;
                const label = dictateBtn.querySelector('.btn-text');
                if (label) {
                    label.textContent = formationListening ? '🛑 Ferma dettatura' : '🎙️ Detta formazione';
                }
            }

            function runFormationRecognition() {
                const recognition = new SpeechRecognitionCtor();
                recognition.lang = 'it-IT';
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                formationRecognition = recognition;

                recognition.onresult = function(e) {
                    let hasFinal = false;
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) {
                            formationFinalTranscript += e.results[i][0].transcript + ' ';
                            hasFinal = true;
                        }
                    }
                    if (hasFinal) applyFormationTranscript(formationFinalTranscript);
                };
                recognition.onerror = function(e) {
                    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                        formationListening = false;
                        updateDictateBtnUI();
                        alert('Permesso microfono negato. Consenti l\'accesso al microfono per usare la dettatura.');
                    }
                    // altri errori (silenzio, rete) vengono gestiti da onend,
                    // che riavvia automaticamente l'ascolto se l'utente non
                    // ha premuto "Ferma dettatura".
                };
                recognition.onend = function() {
                    formationRecognition = null;
                    if (formationListening) {
                        runFormationRecognition();
                    } else {
                        updateDictateBtnUI();
                    }
                };

                try {
                    recognition.start();
                } catch (err) {
                    formationListening = false;
                    formationRecognition = null;
                    updateDictateBtnUI();
                }
            }

            function toggleFormationDictation() {
                if (!speechSupported) return;
                if (formationListening) {
                    formationListening = false;
                    if (formationRecognition) formationRecognition.stop();
                    updateDictateBtnUI();
                } else {
                    formationFinalTranscript = '';
                    formationListening = true;
                    updateDictateBtnUI();
                    runFormationRecognition();
                }
            }

            if (dictateBtn) {
                dictateBtn.addEventListener('click', toggleFormationDictation);
                if (!speechSupported) {
                    dictateBtn.disabled = true;
                    dictateBtn.title = 'Dettatura vocale non supportata in questo browser';
                }
            }

            // ---- HAMBURGER TOGGLE ----
            hamburgerBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                hamburgerDropdown.classList.toggle('open');
            });
            document.addEventListener('click', function(e) {
                if (!hamburgerDropdown.contains(e.target) && e.target !== hamburgerBtn) {
                    hamburgerDropdown.classList.remove('open');
                }
            });

            // ---- COLORE SQUADRA ----
            const colorSwatches = document.querySelectorAll('.color-swatch');

            function applyAccentColor(accent, accentDark, accentRgb) {
                document.documentElement.style.setProperty('--accent', accent);
                document.documentElement.style.setProperty('--accent-dark', accentDark);
                document.documentElement.style.setProperty('--accent-rgb', accentRgb);
                colorSwatches.forEach(function(sw) {
                    sw.classList.toggle('selected', sw.dataset.accent.toLowerCase() === accent.toLowerCase());
                });
            }

            colorSwatches.forEach(function(sw) {
                sw.addEventListener('click', function() {
                    const accent = this.dataset.accent;
                    const accentDark = this.dataset.accentDark;
                    const accentRgb = this.dataset.accentRgb;
                    applyAccentColor(accent, accentDark, accentRgb);
                    try {
                        localStorage.setItem('clubAccentColor', JSON.stringify({ accent: accent, accentDark: accentDark, accentRgb: accentRgb }));
                    } catch (_) {}
                });
            });

            try {
                const savedColor = JSON.parse(localStorage.getItem('clubAccentColor') || 'null');
                if (savedColor && savedColor.accent && savedColor.accentDark && savedColor.accentRgb) {
                    applyAccentColor(savedColor.accent, savedColor.accentDark, savedColor.accentRgb);
                }
            } catch (_) {}

            // ---- LOGO MANAGEMENT ----
            try {
                const savedLogo = localStorage.getItem('clubLogoData');
                if (savedLogo && savedLogo.startsWith('data:image')) {
                    logoImg.src = savedLogo;
                    logoPlaceholder.style.display = 'none';
                    logoUploadMenuItem.style.display = 'none';
                }
            } catch (_) {}

            logoUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    logoImg.src = dataUrl;
                    logoPlaceholder.style.display = 'none';
                    logoUploadMenuItem.style.display = 'none';
                    hamburgerDropdown.classList.remove('open');
                    try {
                        localStorage.setItem('clubLogoData', dataUrl);
                    } catch (_) {
                        alert('Logo troppo grande per il salvataggio automatico. Verrà mantenuto solo per questa sessione.');
                    }
                };
                reader.readAsDataURL(file);
            });

            // ---- HELPERS ----
            function escHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // ---- UPDATE FORMATION OPTIONS ----
            function updateFormationOptions() {
                const count = parseInt(titolarCountEl.value, 10);
                const formations = count === 11 ? FORMATIONS_11 : FORMATIONS_9;
                const currentVal = formationEl.value;
                formationEl.innerHTML = '';
                formations.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    formationEl.appendChild(opt);
                });
                if (!formations.includes(currentVal)) {
                    formationEl.value = formations[0];
                } else {
                    formationEl.value = currentVal;
                }
                playerCountLabel.textContent =
                    `${TOTAL_PLAYERS} giocatori · ${count} titolari · modulo ${formationEl.value}`;
            }

            // ---- RENDER ----
            function renderPlayers() {
                while (playerData.length < TOTAL_PLAYERS) {
                    playerData.push({ name: '', role: 'Difensore', minutes: '', rating: 0, notes: '' });
                }
                while (playerData.length > TOTAL_PLAYERS) {
                    playerData.pop();
                }

                let html = '';
                for (let i = 0; i < TOTAL_PLAYERS; i++) {
                    const p = playerData[i];
                    const num = i + 1;
                    const rating = p.rating || 0;

                    let roleOpts = '';
                    ROLES.forEach(r => {
                        const sel = (p.role === r) ? 'selected' : '';
                        roleOpts += `<option value="${r}" ${sel}>${r}</option>`;
                    });

                    const ratingClass = (rating > 0) ? `rating-${rating}` : '';

                    html += `
                        <tr data-index="${i}">
                            <td class="col-num">${num}</td>
                            <td class="col-name">
                                <input type="text" class="player-name" data-index="${i}" value="${escHtml(p.name)}" placeholder="Nome" />
                            </td>
                            <td class="col-role">
                                <select class="player-role" data-index="${i}">${roleOpts}</select>
                            </td>
                            <td class="col-min">
                                <input type="number" class="player-minutes" data-index="${i}" value="${p.minutes}" placeholder="min" min="0" max="120" />
                            </td>
                            <td class="col-eval">
                                <div class="rating-circle ${ratingClass}" data-player="${i}"></div>
                            </td>
                            <td class="col-notes">
                                <input type="text" class="player-notes" data-index="${i}" value="${escHtml(p.notes)}" placeholder="Note" />
                            </td>
                        </tr>
                    `;
                }

                playerBody.innerHTML = html;

                // ---- EVENTI RATING ----
                document.querySelectorAll('.rating-circle').forEach(circle => {
                    circle.addEventListener('click', function(e) {
                        const idx = parseInt(this.dataset.player, 10);
                        const current = playerData[idx]?.rating || 0;
                        const newVal = (current + 1) % 4;
                        playerData[idx].rating = newVal;
                        renderPlayers();
                        autoSave();
                    });
                });

                // ---- EVENTI CAMPI ----
                document.querySelectorAll('.player-name').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        playerData[idx].name = this.value;
                        autoSave();
                    });
                });
                document.querySelectorAll('.player-role').forEach(sel => {
                    sel.addEventListener('change', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        playerData[idx].role = this.value;
                        autoSave();
                    });
                });
                document.querySelectorAll('.player-minutes').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        playerData[idx].minutes = this.value;
                        autoSave();
                    });
                });
                document.querySelectorAll('.player-notes').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        playerData[idx].notes = this.value;
                        autoSave();
                    });
                });
            }

            // ---- SALVATAGGIO LOCALE ----
            function autoSave() {
                try {
                    const state = {
                        opponent: opponentEl.value,
                        result: resultEl.value,
                        matchType: matchTypeEl.value,
                        venue: venueEl.value,
                        titolarCount: titolarCountEl.value,
                        formation: formationEl.value,
                        playerData: playerData,
                        generalNotes: generalNotesEl.value
                    };
                    localStorage.setItem('matchReportState20', JSON.stringify(state));
                } catch (_) { /* ignore */ }
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem('matchReportState20');
                    if (!raw) return false;
                    const state = JSON.parse(raw);
                    opponentEl.value = state.opponent || '';
                    resultEl.value = state.result || '';
                    matchTypeEl.value = state.matchType || 'Campionato';
                    venueEl.value = state.venue || 'Casa';
                    titolarCountEl.value = state.titolarCount || '11';
                    updateFormationOptions();
                    if (state.formation) {
                        const formations = parseInt(titolarCountEl.value, 10) === 11 ? FORMATIONS_11 : FORMATIONS_9;
                        if (formations.includes(state.formation)) {
                            formationEl.value = state.formation;
                        }
                    }
                    if (state.playerData && Array.isArray(state.playerData) && state.playerData.length === TOTAL_PLAYERS) {
                        playerData = state.playerData.map(p => ({
                            name: p.name || '',
                            role: p.role || 'Difensore',
                            minutes: p.minutes || '',
                            rating: p.rating || 0,
                            notes: p.notes || ''
                        }));
                    } else {
                        playerData = Array.from({ length: TOTAL_PLAYERS }, () => ({
                            name: '',
                            role: 'Difensore',
                            minutes: '',
                            rating: 0,
                            notes: ''
                        }));
                    }
                    generalNotesEl.value = state.generalNotes || '';
                    renderPlayers();
                    const count = parseInt(titolarCountEl.value, 10);
                    playerCountLabel.textContent =
                        `${TOTAL_PLAYERS} giocatori · ${count} titolari · modulo ${formationEl.value}`;
                    return true;
                } catch (_) { return false; }
            }

            // ---- CLEAR / RESET ----
            function clearFormation() {
                if (!confirm('Cancellare nomi, minuti, valutazioni e note di tutti i giocatori?')) return;
                playerData = playerData.map(p => ({
                    ...p,
                    name: '',
                    minutes: '',
                    rating: 0,
                    notes: ''
                }));
                renderPlayers();
                autoSave();
            }

            function resetAll() {
                if (!confirm('Resettare completamente tutti i dati della scheda?')) return;
                opponentEl.value = '';
                resultEl.value = '';
                matchTypeEl.value = 'Campionato';
                venueEl.value = 'Casa';
                titolarCountEl.value = '11';
                updateFormationOptions();
                generalNotesEl.value = '';
                playerData = Array.from({ length: TOTAL_PLAYERS }, () => ({
                    name: '',
                    role: 'Difensore',
                    minutes: '',
                    rating: 0,
                    notes: ''
                }));
                renderPlayers();
                autoSave();
                localStorage.removeItem('matchReportState20');
                const count = parseInt(titolarCountEl.value, 10);
                playerCountLabel.textContent =
                    `${TOTAL_PLAYERS} giocatori · ${count} titolari · modulo ${formationEl.value}`;
            }

            // ---- "GEMELLI" DI TESTO PER L'ESPORTAZIONE PDF ----
            // html2canvas non va a capo il testo dentro input/textarea (lo
            // disegna su una riga sola, che sborda fuori dal riquadro).
            // Prima di catturare, sostituiamo ogni campo con un div dello
            // stesso aspetto ma con wrapping vero: se il contenuto è lungo
            // il div cresce in altezza (e quindi la riga della tabella)
            // invece di essere tagliato.
            // Nel PDF il ruolo viene abbreviato: la colonna è stretta per
            // lasciare spazio alle note, e "Centrocampista" non ci
            // starebbe su una riga sola.
            const ROLE_ABBR = { Portiere: 'POR', Difensore: 'DIF', Centrocampista: 'CEN', Attaccante: 'ATT' };

            function buildPrintOverlay(app) {
                const fields = app.querySelectorAll(
                    '.row .field input, .row .field select, .player-table input, .player-table select, .notes-section textarea'
                );
                const overlayNodes = [];
                fields.forEach(function(field) {
                    let text;
                    if (field.tagName === 'SELECT') {
                        text = field.options[field.selectedIndex] ? field.options[field.selectedIndex].text : '';
                        if (field.classList.contains('player-role')) {
                            text = ROLE_ABBR[text] || text;
                        }
                    } else {
                        text = field.value || '';
                    }

                    // Solo le note (per giocatore e generali) vanno a capo e
                    // fanno crescere la riga: tutti gli altri campi restano
                    // su una riga sola, come nella struttura originale, e si
                    // troncano con "…" nel raro caso non ci stiano.
                    const isNoteField = field.tagName === 'TEXTAREA' || field.classList.contains('player-notes');

                    const cs = getComputedStyle(field);
                    const div = document.createElement('div');
                    div.className = 'print-value';
                    div.textContent = text;
                    div.style.boxSizing = 'border-box';
                    div.style.width = field.offsetWidth + 'px';
                    div.style.minHeight = field.offsetHeight + 'px';
                    div.style.padding = cs.padding;
                    div.style.border = cs.border;
                    div.style.borderRadius = cs.borderRadius;
                    div.style.background = cs.backgroundColor;
                    div.style.fontSize = cs.fontSize;
                    div.style.fontFamily = cs.fontFamily;
                    div.style.color = cs.color;
                    div.style.textAlign = field.tagName === 'INPUT' && field.type === 'number' ? 'center' : cs.textAlign;
                    div.style.lineHeight = '1.35';
                    if (isNoteField) {
                        div.style.whiteSpace = 'pre-wrap';
                        div.style.wordBreak = 'break-word';
                        div.style.overflowWrap = 'anywhere';
                    } else {
                        div.style.whiteSpace = 'nowrap';
                        div.style.overflow = 'hidden';
                        div.style.textOverflow = 'ellipsis';
                        div.style.display = 'flex';
                        div.style.alignItems = 'center';
                        div.style.justifyContent = field.tagName === 'INPUT' && field.type === 'number' ? 'center' : 'flex-start';
                    }
                    field.insertAdjacentElement('afterend', div);
                    field.dataset.pdfHidden = '1';
                    overlayNodes.push(div);
                });
                return overlayNodes;
            }

            function removePrintOverlay(app, overlayNodes) {
                overlayNodes.forEach(function(n) { n.remove(); });
                app.querySelectorAll('[data-pdf-hidden]').forEach(function(f) {
                    delete f.dataset.pdfHidden;
                });
            }

            // ---- ESPORTA PDF (verticale, tutto in una sola pagina) ----
            // La dimensione della pagina PDF viene calcolata sull'altezza
            // reale del contenuto (invece di usare una A4 fissa), così il
            // report sta sempre per intero in un'unica pagina verticale,
            // qualsiasi sia il numero di righe/note compilate.
            function exportPdf() {
                autoSave();
                const btn = exportBtn;
                btn.classList.add('loading');
                btn.disabled = true;

                const app = document.getElementById('app');
                app.classList.add('pdf-export');

                // Azzera eventuali scroll (pagina e tabella) che
                // sfaserebbero l'area catturata da html2canvas.
                window.scrollTo(0, 0);
                document.querySelectorAll('.table-wrap').forEach(function(el) {
                    el.scrollLeft = 0;
                });

                // Aspetta che il browser applichi il nuovo layout (larghezza
                // fissa, elementi nascosti) prima di costruire i "gemelli"
                // di testo e misurare/catturare.
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        const overlayNodes = buildPrintOverlay(app);

                        // Un ulteriore tick: i div con testo lungo vanno a
                        // capo su più righe e crescono in altezza, quindi la
                        // misura dell'altezza va presa DOPO questo reflow.
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                const PX_TO_MM = 25.4 / 96;

                                // Dimensioni reali dell'elemento così com'è
                                // renderizzato, con un margine di sicurezza
                                // generoso in altezza (le misure del layout
                                // possono variare leggermente da quelle
                                // dell'immagine catturata) per evitare che una
                                // riga finisca tagliata su una seconda pagina.
                                const rect = app.getBoundingClientRect();
                                const widthPx = rect.width;
                                const heightPx = Math.max(rect.height, app.scrollHeight) + 40;

                                const widthMm = widthPx * PX_TO_MM;
                                const heightMm = heightPx * PX_TO_MM;

                                function finish() {
                                    removePrintOverlay(app, overlayNodes);
                                    app.classList.remove('pdf-export');
                                    btn.classList.remove('loading');
                                    btn.disabled = false;
                                }

                                // NON passiamo width/height/windowWidth/windowHeight
                                // a html2canvas (forzarli causa un disallineamento
                                // noto della cattura, con contenuto tagliato a
                                // sinistra). Lasciamo che rilevi da solo l'area
                                // dell'elemento.
                                const opt = {
                                    margin: 0,
                                    filename: `match-report_${new Date().toISOString().slice(0,10)}.pdf`,
                                    image: { type: 'jpeg', quality: 0.95 },
                                    html2canvas: {
                                        scale: 2,
                                        useCORS: true,
                                        logging: false,
                                        letterRendering: true,
                                        backgroundColor: '#ffffff',
                                        scrollX: -window.scrollX,
                                        scrollY: -window.scrollY,
                                    },
                                    jsPDF: {
                                        unit: 'mm',
                                        format: [widthMm, heightMm],
                                        orientation: 'portrait'
                                    },
                                    pagebreak: { mode: ['avoid-all'] }
                                };

                                html2pdf()
                                    .set(opt)
                                    .from(app)
                                    .save()
                                    .then(finish)
                                    .catch((err) => {
                                        console.error('PDF error:', err);
                                        finish();
                                        alert('Errore durante la generazione del PDF. Riprova.');
                                    });
                            });
                        });
                    });
                });
            }

            // ---- EVENTI GLOBALI ----
            opponentEl.addEventListener('input', autoSave);
            resultEl.addEventListener('input', autoSave);
            matchTypeEl.addEventListener('change', autoSave);
            venueEl.addEventListener('change', autoSave);
            generalNotesEl.addEventListener('input', autoSave);

            titolarCountEl.addEventListener('change', function() {
                updateFormationOptions();
                const count = parseInt(this.value, 10);
                playerCountLabel.textContent =
                    `${TOTAL_PLAYERS} giocatori · ${count} titolari · modulo ${formationEl.value}`;
                autoSave();
            });

            formationEl.addEventListener('change', function() {
                const count = parseInt(titolarCountEl.value, 10);
                playerCountLabel.textContent =
                    `${TOTAL_PLAYERS} giocatori · ${count} titolari · modulo ${this.value}`;
                autoSave();
            });

            clearBtn.addEventListener('click', clearFormation);
            resetBtn.addEventListener('click', resetAll);
            exportBtn.addEventListener('click', exportPdf);

            // ---- INIT ----
            const loaded = loadState();
            if (!loaded) {
                titolarCountEl.value = '11';
                updateFormationOptions();
                playerData = Array.from({ length: TOTAL_PLAYERS }, () => ({
                    name: '',
                    role: 'Difensore',
                    minutes: '',
                    rating: 0,
                    notes: ''
                }));
                renderPlayers();
                const count = parseInt(titolarCountEl.value, 10);
                playerCountLabel.textContent =
                    `${TOTAL_PLAYERS} giocatori · ${count} titolari · modulo ${formationEl.value}`;
            }

            // Ctrl+Enter per esportare
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    exportPdf();
                }
            });

            console.log('🏆 Match Report · Bianco Nero Granata loaded. Ctrl+Enter per PDF.');
        })();
    </script>

</body>
</html>
